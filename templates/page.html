{% extends "base.html" %}

{% block content %}
  <div class="flex justify-center text-3xl opacity-80 my-2"> {{ page.title }} </div>

    <div class="flex align-center text-sm w-fit mx-auto text-[#999]">
      <~~ 发表日期:{{ page.date }}  |  
          本文词数:{{ page.word_count }}  |  
          预计阅读时间:{{ page.reading_time }}分钟 ~~>
    </div>

  <div class="p-4">
		{{ page.content | safe }}
  </div>
{% endblock content %}
