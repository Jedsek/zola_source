{% extends "base.html" %}

{% block content %}
  <div class="flex justify-center text-3xl my-6 opacity-80"> 
		{% if page.title %} {{ page.title }} {% endif %} 
		{% if section.title %} {{ section.title }} {% endif %} 
	</div>

	<div class="navigation px-4 [&_ul]:list-none [&_ul]:px-0">
		{% if page.content %} {{ page.content | safe }} {% endif %} 
		{% if section.content %} {{ section.content | safe }} {% endif %} 
	</div>

{% endblock content %}
